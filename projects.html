
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Projects | Project Pal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Project<span>Pal.</span></div>

        <nav>
            <a href="index.html">Home</a>
            <a href="projects.html">Explore Projects</a>
            <a href="teammates.html">Find Teammates</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>

        <div class="hero-buttons">
            <button id="themeToggle" class="theme-toggle">☀ Light</button>
            <a href="create-project.html" class="nav-btn">Create Project</a>
        </div>
    </header>

    <section class="projects-section">
        <h1>Explore <span>Projects</span></h1>
        <p>Find interesting projects and connect with creative students.</p>

        <input
            type="text"
            id="searchInput"
            placeholder="Search projects by name or technology..."
        >

        <div class="project-grid" id="projectGrid">
            <p>Loading projects...</p>
        </div>

        <p id="noResults" style="display:none;">No projects found.</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/theme.js"></script>

</body>
</html>
